name: Release

# Pushing a tag like `v0.2.0` builds the Windows installers and publishes them as
# a GitHub release. A manual run from the Actions tab builds the same installers
# and leaves them as downloadable artifacts, without touching releases.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# `contents: write` is what lets the final step create the release.
permissions:
  contents: write

jobs:
  windows-installer:
    name: Windows installer (${{ matrix.arch }})
    runs-on: windows-latest

    strategy:
      # One architecture failing should not cancel the other.
      fail-fast: false
      # Both architectures ship. arm64 needs ELECTRON_BUILDER_7Z_FILTER=BCJ2 on
      # the installer step below: electron-builder 26.15.3 hands the ARM64
      # payload to 7-Zip without an explicit filter, 7-Zip then auto-selects its
      # ARM64 branch converter, and the NSIS extraction plugin cannot decode
      # those streams — it skips every .exe and .dll, reports success, and
      # installs an app with no executable. Verified locally by installing the
      # arm64 setup: without the filter the install had 0 DLLs and no
      # FocusFlow.exe; with it, the executable, all six DLLs and
      # win32-arm64.node were present.
      matrix:
        arch: [x64, arm64]

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$(node -p "require('./package.json').version")"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Building FocusFlow ${version} for ${{ matrix.arch }}"

      - name: Install dependencies
        # Installs exactly the versions in package-lock.json. No cross-
        # architecture handling is needed: better-sqlite3 v13 ships the prebuild
        # for every platform inside its own tarball and picks one at runtime
        # from `process.arch`, so a single install covers both matrix legs.
        run: npm ci

      - name: Sync package.json version to the tag
        shell: bash
        run: npm version "${{ steps.version.outputs.version }}" --no-git-tag-version --allow-same-version
        # The tag is the source of truth, so the installer filename, the
        # `latest.yml` update manifest and the release name all agree.

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build the installer
        # `--publish never` keeps electron-builder from creating the release
        # itself: the last step below does it explicitly, so the asset list and
        # the release notes are under our control.
        #
        # BCJ2 is forced for arm64 only. x64 keeps 7-Zip's own choice (the same
        # classic BCJ2 filter), so the proven x64 payload is untouched; an empty
        # value means "no explicit filter" to electron-builder.
        run: npm run dist -- --publish never --${{ matrix.arch }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ELECTRON_BUILDER_7Z_FILTER: ${{ matrix.arch == 'arm64' && 'BCJ2' || '' }}

      - name: Verify the packaged native addon matches the target architecture
        # Checks the tree electron-builder actually packs, because the failure
        # this guards against is silent: a wrong glob ships an installer that
        # installs cleanly and then dies on first launch.
        run: node scripts/verify-native-arch.mjs ${{ matrix.arch }}

      - name: Keep the installer as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: focusflow-windows-${{ steps.version.outputs.version }}-${{ matrix.arch }}
          if-no-files-found: error
          path: |
            release/*.exe
            release/*.blockmap

      - name: Publish the release
        if: github.ref_type == 'tag'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARCH: ${{ matrix.arch }}
        run: |
          assets=()
          for file in release/*.exe release/*.blockmap; do
            [ -e "$file" ] && assets+=("$file")
          done

          # A second architecture would generate `latest.yml` under the same
          # name, so keep it arch-suffixed.
          if [ -f release/latest.yml ]; then
            cp release/latest.yml "release/latest-${ARCH}.yml"
            assets+=("release/latest-${ARCH}.yml")
          fi

          tag="${GITHUB_REF_NAME}"

          if ! gh release view "$tag" >/dev/null 2>&1; then
            # The two jobs start together, so one can lose this race. Losing it
            # is harmless: the winner is creating the release we upload to next.
            gh release create "$tag" \
              --title "FocusFlow ${{ steps.version.outputs.version }}" \
              --generate-notes || true
          fi

          gh release upload "$tag" "${assets[@]}" --clobber
