name: Release

# Pushing a tag like `v0.2.0` builds the Windows installers and publishes them as
# a GitHub release. A manual run from the Actions tab builds the same installers
# and leaves them as downloadable artifacts, without touching releases.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# `contents: write` is what lets the final step create the release.
permissions:
  contents: write

jobs:
  windows-installer:
    name: Windows installer (${{ matrix.arch }})
    runs-on: windows-latest

    strategy:
      # One architecture failing should not cancel the other.
      fail-fast: false
      matrix:
        arch: [x64, arm64]

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$(node -p "require('./package.json').version")"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Building FocusFlow ${version} for ${{ matrix.arch }}"

      - name: Install dependencies
        # `npm ci` needs a committed lockfile; this repository has none yet.
        # No cross-architecture handling is needed here: better-sqlite3 v13
        # ships the prebuild for every platform inside its own tarball and picks
        # one at runtime from `process.arch`, so a single install covers both
        # legs of the matrix.
        run: npm install

      - name: Sync package.json version to the tag
        shell: bash
        run: npm version "${{ steps.version.outputs.version }}" --no-git-tag-version --allow-same-version
        # The tag is the source of truth, so the installer filename, the
        # `latest.yml` update manifest and the release name all agree.

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build the installer
        # `--publish never` keeps electron-builder from creating the release
        # itself: the last step below does it explicitly, so the asset list and
        # the release notes are under our control.
        run: npm run dist -- --publish never --${{ matrix.arch }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify the packaged native addon matches the target architecture
        # Checks the tree electron-builder actually packs, because the failure
        # this guards against is silent: a wrong glob ships an installer that
        # installs cleanly and then dies on first launch.
        run: node scripts/verify-native-arch.mjs ${{ matrix.arch }}

      - name: Keep the installer as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: focusflow-windows-${{ steps.version.outputs.version }}-${{ matrix.arch }}
          if-no-files-found: error
          path: |
            release/*.exe
            release/*.blockmap

      - name: Publish the release
        if: github.ref_type == 'tag'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARCH: ${{ matrix.arch }}
        run: |
          assets=()
          for file in release/*.exe release/*.blockmap; do
            [ -e "$file" ] && assets+=("$file")
          done

          # Both matrix jobs generate `latest.yml` under the same name, so left
          # alone they would overwrite each other. Nothing reads it yet — the app
          # ships no electron-updater — and a future updater would need one
          # channel per architecture anyway, so keep it arch-suffixed.
          if [ -f release/latest.yml ]; then
            cp release/latest.yml "release/latest-${ARCH}.yml"
            assets+=("release/latest-${ARCH}.yml")
          fi

          tag="${GITHUB_REF_NAME}"

          if ! gh release view "$tag" >/dev/null 2>&1; then
            # The two jobs start together, so one can lose this race. Losing it
            # is harmless: the winner is creating the release we upload to next.
            gh release create "$tag" \
              --title "FocusFlow ${{ steps.version.outputs.version }}" \
              --generate-notes || true
          fi

          gh release upload "$tag" "${assets[@]}" --clobber
